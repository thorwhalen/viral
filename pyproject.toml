[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "viral"
version = "0.0.3"
description = "Acquiring and analyzing covid-19 (coronavirus) statistics data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "py2store",
    "pandas",
    "kaggle",
    "haggle",
    "six",  # kaggle imports it without declaring it
]

[project.urls]
Homepage = "https://github.com/thorwhalen/viral"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "scrap",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    "**/*.md",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "viral",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "viral"

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = ["KAGGLE_USERNAME", "KAGGLE_KEY", "viral_sources_dir"]
extra_envvars = []

[tool.wads.ci.env.defaults]
# haggle authenticates to Kaggle at import time; dummies let the doctests be collected
KAGGLE_USERNAME = "ci-dummy"
KAGGLE_KEY = "ci-dummy"
# viral.base raises at import if this directory is missing
viral_sources_dir = "."

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"
skip_publish_marker = "[skip publish]"

[tool.wads.ci.docs]
enabled = true
skip_marker = "[skip github-pages]"
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
